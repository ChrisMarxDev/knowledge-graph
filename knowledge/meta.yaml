types:
  skill:
    description: An agent workflow, discoverable as knowledge without activating it.
  concept:
    description: What something is and how it works, including project purpose and
      architecture.
  decision:
    description: A selected approach, its rationale, and relevant tradeoffs.
  rule:
    description: A requirement or constraint that should guide work.
  question:
    description: An unresolved choice, investigation, or evidence gap.
  guide:
    description: How to accomplish a task or follow a workflow.
dimensions:
  feature:
    description: "Relevant project features: product, graph, retrieval, authoring,
      schema, explorer, tooling. Multiple values are allowed."
  component:
    description: "Where behavior is exposed: cli, api, ui, files. Multiple values
      are allowed; omit when not applicable."
  status:
    description: "Optional markers: proposed, accepted, implemented, superseded,
      highlight. Highlight means Christopher explicitly designated the document
      as higher-authority source truth; it may coexist with lifecycle markers.
      Agents must not infer highlight from generated content or remove it
      without explicit direction. Highlight does not imply implemented or
      override newer explicit corrections."
relations:
  part_of:
    description: Knowledge belonging to its project.
  depends_on:
    description: An explicit technical or conceptual dependency.
  governed_by:
    description: Connects a subject to applicable constraints.
