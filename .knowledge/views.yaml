version: 1
views:
  frontend:
    title: Frontend & explorer
    description: Explorer concepts, saved views, and the shared identity model.
    filter:
      op: or
      filters:
        - op: and
          filters:
            - { field: dimensions.area, op: in, value: [ui, explorer] }
            - { field: type, op: in, value: [concept, decision, constraint] }
        - { field: id, op: eq, value: 817d288b-1c68-4b51-9f67-5666325ec223 }
  product:
    title: Product overview
    description: Product direction and explorer capabilities, without development constraints.
    filter:
      op: and
      filters:
        - { field: dimensions.area, op: in, value: [product, ui, explorer] }
        - op: not
          filters:
            - { field: type, op: eq, value: constraint }
  retrieval:
    title: Retrieval & context
    description: Query decisions and saved views, plus identity and file-scope foundations.
    filter:
      op: or
      filters:
        - { field: dimensions.area, op: eq, value: retrieval }
        - field: id
          op: in
          value:
            - 817d288b-1c68-4b51-9f67-5666325ec223
            - 77f2fba5-7c18-4abc-8a56-51062e13f8de
  development:
    title: Development foundations
    description: Core contracts, schemas, tooling, and repository workflow.
    filter:
      field: dimensions.area
      op: in
      value: [core, schema, tooling, workflow]
